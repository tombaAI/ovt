name: Záloha databáze

on:
  schedule:
    - cron: '0 2 * * *'  # každý den 02:00 UTC (04:00 Praha)
  workflow_dispatch:       # ruční spuštění z GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Nastavit datum
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Nainstalovat PostgreSQL 17 client
        run: |
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Záloha databáze (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --schema=app \
            --no-password \
            --format=plain \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            | gzip > "ovt-backup-${{ steps.date.outputs.date }}.sql.gz"

      - name: Nahrát zálohu jako artifact
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ steps.date.outputs.date }}
          path: ovt-backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error
